<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>页面3 — 动态信</title>
    <link rel="stylesheet" href="css1美化.css">
    <style>
      body{margin:0;font-family:Segoe UI,Arial,Helvetica,sans-serif;background:#fafafa}
      .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;box-sizing:border-box}
      .letter{max-width:760px;width:90%;background:#fff;border-radius:8px;padding:24px;box-shadow:0 6px 20px rgba(0,0,0,.08);color:#222}
      .meta{color:#666;font-size:14px;margin-bottom:12px}
      .content{white-space:pre-wrap;font-size:16px;line-height:1.6;min-height:160px}
      .controls{margin-top:14px}
      a.button{display:inline-block;padding:8px 12px;background:#1976d2;color:#fff;border-radius:6px;text-decoration:none}
      /* 移动端优化：在窄屏提高可读性与触控尺寸 */
      @media (max-width:600px){
        .letter{padding:18px}
        .content{font-size:18px;line-height:1.7}
        a.button, #replay{padding:12px 14px}
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="letter">
        <div class="meta">致：访客 &nbsp;|&nbsp; 日期：2026-05-09</div>
        <div id="content" class="content"></div>
        <div class="controls">
          <a class="button" href="index.html">返回首页</a>
          <button id="replay" style="margin-left:8px;padding:8px 12px;border-radius:6px">重放</button>
        </div>
      </div>
    </div>
    <script>
      // 动态打字效果：把 longText 字符逐个写入到 #content
      (function(){
        var longText = "亲爱的访客，\n\n这是一个动态信的示例。页面将逐字显示这段文本，以模拟一封正在书写的信件。\n\n你可以把这里替换为任意内容或通过 fetch 从服务器加载。\n\n祝好，\n示例团队";
        var el = document.getElementById('content');
        var idx = 0; var timer = null;
        function typeOnce(){
          if(idx <= longText.length){
            el.textContent = longText.slice(0, idx);
            idx++;
            timer = setTimeout(typeOnce, 24);
          } else {
            clearTimeout(timer);
          }
        }
        document.getElementById('replay').addEventListener('click', function(){
          clearTimeout(timer); idx = 0; el.textContent = ''; typeOnce();
        });
        typeOnce();
      })();
    </script>
  </body>
</html>
